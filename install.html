<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install PWA - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <button id="logoutBtn" class="btn btn-pink">Logout</button>

    <h1 class="glitch-text">INSTALLER</h1>

    <div class="container" style="text-align:center;">
        <h2>Pasang ke Beranda</h2>
        <p style="margin-bottom:20px;">Klik tombol di bawah ini untuk menginstal aplikasi Web Pembayaran ke layar utama/beranda HP Anda.</p>
        
        <button id="installBtn" class="btn" style="display: none;">Install App</button>
        <p id="installMsg" style="color:var(--neon-pink); display:none; margin-top:10px;">Aplikasi sudah terpasang atau browser Anda tidak mendukung instalasi PWA secara langsung.</p>

    </div>

    <script type="module">
        import { checkLogin, logout } from './app.js';
        
        const user = checkLogin();
        
        const logoutBtn = document.getElementById('logoutBtn');
        if(user) {
            logoutBtn.addEventListener('click', logout);
        } else {
            logoutBtn.style.display = 'none';
        }


        // PWA Installation Logic
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const installMsg = document.getElementById('installMsg');

        // Deteksi apakah perangkat adalah iPhone/iPad (iOS)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        if (isStandalone) {
            installMsg.innerHTML = "✅ Aplikasi Web Pembayaran sudah terpasang di perangkat Anda.";
            installMsg.style.display = 'block';
            installMsg.style.color = 'var(--neon-cyan)';
        } else if (isIOS) {
            // Apple tidak mendukung sebeluminstallprompt, jadi harus panduan manual
            installMsg.innerHTML = "<strong>Khusus Pengguna iPhone/iPad:</strong><br><br>Safari Apple tidak mendukung tombol install otomatis. Untuk menginstal:<br>1. Tekan tombol <strong>Share</strong> (ikon kotak dengan panah ke atas) di bagian bawah Safari.<br>2. Geser ke bawah lalu pilih <strong>'Add to Home Screen'</strong> (Tambah ke Layar Utama).";
            installMsg.style.display = 'block';
            installMsg.style.color = 'var(--neon-cyan)';
        } else {
            // Untuk Android (Chrome, dsb)
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = 'inline-block';
                installMsg.style.display = 'none';
            });

            installBtn.addEventListener('click', (e) => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the A2HS prompt');
                    } else {
                        installBtn.style.display = 'inline-block';
                    }
                    deferredPrompt = null;
                });
            });

            // Jika dalam 3 detik tidak muncul tombol, beri pesan peringatan
            setTimeout(() => {
                if(!deferredPrompt && installBtn.style.display === 'none') {
                    installMsg.innerHTML = "⚠️ <strong>Tidak Bisa Menginstal (Android)</strong><br><br>Kemungkinan penyebab:<br>1. Anda menggunakan koneksi HTTP biasa (harus HTTPS atau localhost).<br>2. Aplikasi ini sudah terinstal.<br>3. Buka lewat browser Google Chrome agar fitur ini berjalan.";
                    installMsg.style.display = 'block';
                    installMsg.style.color = 'var(--neon-pink)';
                }
            }, 3000);
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(function(registration) {
                console.log('Registration successful, scope is:', registration.scope);
            })
            .catch(function(error) {
                console.log('Service worker registration failed, error:', error);
            });
        }
    </script>
</body>
</html>
