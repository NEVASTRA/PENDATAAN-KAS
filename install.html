<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install PWA - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <button id="logoutBtn" class="btn btn-pink">Logout</button>

    <h1 class="glitch-text">INSTALLER</h1>

    <div class="container" style="text-align:center;">
        <h2>Pasang ke Beranda</h2>
        <p style="margin-bottom:20px;">Klik tombol di bawah ini untuk menginstal aplikasi Web Pembayaran ke layar utama/beranda HP Anda.</p>
        
        <button id="installBtn" class="btn" style="display: none;">Install App</button>
        <p id="installMsg" style="color:var(--neon-pink); display:none; margin-top:10px;">Aplikasi sudah terpasang atau browser Anda tidak mendukung instalasi PWA secara langsung.</p>

        <a href="index.html" class="btn btn-pink" style="margin-top: 20px; display:inline-block; text-decoration:none;">Kembali ke Halaman Utama</a>
    </div>

    <script type="module">
        import { checkLogin, logout } from './app.js';
        
        const user = checkLogin();
        
        const logoutBtn = document.getElementById('logoutBtn');
        if(user) {
            logoutBtn.addEventListener('click', logout);
        } else {
            logoutBtn.style.display = 'none';
        }


        // PWA Installation Logic
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const installMsg = document.getElementById('installMsg');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI to notify the user they can add to home screen
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', (e) => {
            // hide our user interface that shows our A2HS button
            installBtn.style.display = 'none';
            // Show the prompt
            deferredPrompt.prompt();
            // Wait for the user to respond to the prompt
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the A2HS prompt');
                } else {
                    console.log('User dismissed the A2HS prompt');
                    installBtn.style.display = 'inline-block';
                }
                deferredPrompt = null;
            });
        });

        // if the event never fires in a few seconds, show the message
        setTimeout(() => {
            if(!deferredPrompt && installBtn.style.display === 'none') {
                installMsg.style.display = 'block';
            }
        }, 2000);

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(function(registration) {
                console.log('Registration successful, scope is:', registration.scope);
            })
            .catch(function(error) {
                console.log('Service worker registration failed, error:', error);
            });
        }
    </script>
</body>
</html>
