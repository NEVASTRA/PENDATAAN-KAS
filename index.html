<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevastra - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <h1 class="glitch-text">NEVASTRA v1.0</h1>

    <div class="container">
        <h2>System Login</h2>
        <div id="alertBox" class="alert error">Username atau Password salah!</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" required placeholder="Masukkan Username">
            </div>
            
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" required placeholder="Masukkan Password">
            </div>

            <button type="submit" class="btn">Access System</button>
        </form>
    </div>

    <script type="module">
        import { users } from './app.js';
        
        // Auto-redirect if already logged in
        const currentUser = localStorage.getItem('currentUser');
        if(currentUser) {
            const user = JSON.parse(currentUser);
            if(user.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'input.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const uname = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            const foundUser = users.find(u => u.username === uname && u.password === pass);

            if(foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                
                if(foundUser.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'input.html';
                }
            } else {
                alertBox.style.display = 'block';
                setTimeout(() => alertBox.style.display = 'none', 3000);
            }
        });
    </script>
</body>
</html>
